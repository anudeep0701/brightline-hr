services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brightline
      POSTGRES_USER: brightline
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in your shell for local PostgreSQL}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightline"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
